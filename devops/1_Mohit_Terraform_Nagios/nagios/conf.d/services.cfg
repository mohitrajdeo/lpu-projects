# ==============================================================================
# INT333: DevOps Advance Configuration Management
# Dual-Tier Continuous Monitoring Service Probes
# ==============================================================================

# Tier 1: Website Ingress Monitoring (Port 80 HTTP / 443 HTTPS)
define service {
    use                     generic-service
    host_name               web-portal-server
    service_description     HTTP_Web_Portal_Uptime
    check_command           check_http!-u /health -e "healthy"
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    notification_interval   15
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}

# Tier 2: Backend Code Execution Socket Probing (TCP Port 9010)
define service {
    use                     generic-service
    host_name               web-portal-server
    service_description     TCP_Code_Execution_Engine
    check_command           check_tcp!9010
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    notification_interval   15
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}

# Tier 3: Network ICMP Latency & Host Reachability
define service {
    use                     generic-service
    host_name               web-portal-server
    service_description     ICMP_Ping_Host_Latency
    check_command           check_ping!100.0,20%!500.0,60%
    check_interval          1
    retry_interval          1
    max_check_attempts      5
    notification_interval   30
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}

