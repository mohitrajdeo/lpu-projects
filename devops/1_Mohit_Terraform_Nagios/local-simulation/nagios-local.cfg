# Local Simulation Nagios Configuration
# INT333: Mohit Raj Deo (12323329)

define host {
    use                     linux-server
    host_name               web-portal-server
    alias                   Mohit Developer Portal & Code Runner Container
    address                 nginx-proxy
    check_command           check_ping!100.0,20%!500.0,60%
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   15
    notification_period     24x7
}

define host {
    use                     linux-server
    host_name               code-runner-daemon
    alias                   Port 9010 Autonomous Code Runner
    address                 code-runner
    check_command           check_ping!100.0,20%!500.0,60%
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   15
    notification_period     24x7
}

define service {
    use                     generic-service
    host_name               web-portal-server
    service_description     HTTP_Web_Portal_Uptime
    check_command           check_http!-u /health -e "healthy"
    check_interval          1
    retry_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               code-runner-daemon
    service_description     TCP_Code_Execution_Engine
    check_command           check_tcp!9010
    check_interval          1
    retry_interval          1
    max_check_attempts      3
}

