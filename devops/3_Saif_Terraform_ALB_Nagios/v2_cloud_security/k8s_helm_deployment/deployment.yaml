apiVersion: apps/v1
kind: Deployment
metadata:
  name: saif-multitier-workload
  namespace: production
  labels:
    app: secure-web-portal
    tier: frontend
    student: saif_siddique
spec:
  replicas: 3
  selector:
    matchLabels:
      app: secure-web-portal
  template:
    metadata:
      labels:
        app: secure-web-portal
    spec:
      containers:
        - name: web-app
          image: nginx:alpine-slim
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saif-web-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saif-multitier-workload
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

