events { worker_connections 1024; }

http {
    upstream secops_backend_nodes {
        server secops-worker-1:5003;
        server secops-worker-2:5003;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://secops_backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            proxy_pass http://secops_backend_nodes/health;
        }

        location /metrics {
            proxy_pass http://secops_backend_nodes/metrics;
        }
    }
}
