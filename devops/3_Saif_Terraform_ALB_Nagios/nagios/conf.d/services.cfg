# Nagios Services for Multi-Tier Infrastructure
define service {
    use                     generic-service
    host_name               alb-load-balancer
    service_description     HTTP_ALB_Ingress
    check_command           check_http!-u /health
    check_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               app-node-1
    service_description     NRPE_Memory_Utilization
    check_command           check_nrpe!check_mem
    check_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               app-node-2
    service_description     NRPE_Memory_Utilization
    check_command           check_nrpe!check_mem
    check_interval          1
    max_check_attempts      3
}

