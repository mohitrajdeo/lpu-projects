# Puppet Master Port 8140 Probe
define service {
    use                     generic-service
    host_name               puppet-master
    service_description     Puppet_Server_Control_Plane
    check_command           check_tcp!8140
    check_interval          1
    retry_interval          1
    max_check_attempts      3
}

# Web Service Port 80 Probe
define service {
    use                     generic-service
    host_name               puppet-agent-1
    service_description     HTTP_Nginx_Service
    check_command           check_http
    check_interval          1
    retry_interval          1
    max_check_attempts      3
}

# NRPE Port 5666 Probes
define service {
    use                     generic-service
    host_name               puppet-agent-1
    service_description     NRPE_Root_Disk_Space
    check_command           check_nrpe!check_disk
    check_interval          1
    retry_interval          1
    max_check_attempts      3
}

define service {
    use                     generic-service
    host_name               puppet-agent-1
    service_description     NRPE_Nginx_Process
    check_command           check_nrpe!check_nginx
    check_interval          1
    retry_interval          1
    max_check_attempts      3
}

