# Nagios Host Definitions for Puppet Cluster
define host {
    use                     linux-server
    host_name               puppet-master
    alias                   Puppet Master Server (8140)
    address                 10.100.1.10
    check_command           check_ping!100.0,20%!500.0,60%
    max_check_attempts      3
}

define host {
    use                     linux-server
    host_name               puppet-agent-1
    alias                   Web Server Node (Agent 1)
    address                 10.100.1.20
    check_command           check_ping!100.0,20%!500.0,60%
    max_check_attempts      3
}

