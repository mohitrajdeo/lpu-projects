name: AegisOps CI/CD & Security Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Unit Tests & Empirical Benchmarks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Test Suite
      run: |
        python -m pytest tests/ -v --junitxml=junit.xml

    - name: Run Anomaly Detection Benchmark Validation
      run: |
        python benchmark/run_benchmark.py

    - name: Generate Publication Charts
      run: |
        python benchmark/generate_charts.py

    - name: Build Docker Container Artifact
      run: |
        docker build -t aegisops:latest .

